name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 获取源码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 构建网站
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传构建结果
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v5
